name: build-windows-github

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install WinDivert 2.2.2-A
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installDir = "C:\WinDivert-2.2.2-A"
          $zipUrl = "https://reqrypt.org/download/WinDivert-2.2.2-A.zip"
          $zipPath = "$env:TEMP\WinDivert-2.2.2-A.zip"
          $extractRoot = "$env:TEMP\WinDivertExtract"

          if (Test-Path $installDir) {
            Write-Host "WinDivert already exists at $installDir"
            exit 0
          }

          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath

          if (Test-Path $extractRoot) {
            Remove-Item $extractRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force

          $sourceDir = Join-Path $extractRoot "WinDivert-2.2.2-A"

          if (!(Test-Path $sourceDir)) {
            Write-Error "WinDivert extracted folder not found"
            Get-ChildItem $extractRoot -Recurse
            exit 1
          }

          Move-Item -Path $sourceDir -Destination $installDir
          Write-Host "WinDivert installed at $installDir"

      - name: Check Visual Studio C++ tools
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vsWhere)) {
            Write-Error "vswhere.exe not found"
            exit 1
          }

          $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (!$vsPath) {
            Write-Error "Visual Studio C++ tools not found"
            exit 1
          }

          Write-Host "Visual Studio found at: $vsPath"

          $vcvarsPath = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (!(Test-Path $vcvarsPath)) {
            Write-Error "vcvarsall.bat not found"
            exit 1
          }

          Write-Host "vcvarsall.bat found: $vcvarsPath"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Build
        shell: pwsh
        run: |
          .\Windows\compile.ps1 -Compiler msvc -NoSign

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBridge-windows-output
          path: output/**
          if-no-files-found: error
